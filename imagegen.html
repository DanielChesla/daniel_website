<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Generator</title>
    <meta name="description" content="Pick background, style, and character sex to generate a prompt and image." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <!-- Shared header/footer -->
    <div id="header-include"></div>

    <header class="py-5 bg-light border-bottom">
      <div class="container">
        <h1 class="display-6 fw-bold">Image Generator</h1>
        <p class="lead text-secondary mb-0">Choose options and we’ll create a prompt and generate an image.</p>
      </div>
    </header>

    <main class="py-5">
      <div class="container">
        <form id="imageForm" class="row g-4">
          <div class="col-md-4">
            <label for="background" class="form-label">Background</label>
            <select id="background" class="form-select" required>
              <option value="">-- Choose --</option>
              <option>snow</option>
              <option>desert</option>
              <option>ocean</option>
              <option>forest</option>
              <option>field</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="style" class="form-label">Character Style</label>
            <select id="style" class="form-select" required>
              <option value="">-- Choose --</option>
              <option>Disney style</option>
              <option>Anime style</option>
              <option>Family Guy style</option>
              <option>Simpsons style</option>
            </select>
          </div>

          <div class="col-md-4">
            <label for="sex" class="form-label">Character Sex</label>
            <select id="sex" class="form-select" required>
              <option value="">-- Choose --</option>
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>

          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Generate Image</button>
            <button type="button" id="copyPrompt" class="btn btn-outline-secondary">Copy Prompt</button>
          </div>
        </form>

        <div id="promptBox" class="alert alert-info mt-4 d-none"></div>

        <div id="result" class="mt-4 d-none">
          <div class="d-flex align-items-center gap-2 mb-2">
            <div class="spinner-border" role="status" id="spinner" aria-hidden="true"></div>
            <strong>Generating…</strong>
          </div>
          <img id="output" alt="Generated" class="img-fluid rounded shadow-sm d-none" />
        </div>

        <div id="errorBox" class="alert alert-danger mt-4 d-none"></div>
      </div>
    </main>

    <div id="footer-include"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="include-loader.js"></script>
    <script>
      // 👉 Set this to your deployed Worker/Function URL (see step 2)
      // Example after deploy: const API_URL = "https://your-worker.subdomain.workers.dev/generate-image";
      const API_URL = "https://YOUR_WORKER_URL_HERE/generate-image";

      const form = document.getElementById("imageForm");
      const result = document.getElementById("result");
      const spinner = document.getElementById("spinner");
      const img = document.getElementById("output");
      const promptBox = document.getElementById("promptBox");
      const errorBox = document.getElementById("errorBox");
      const copyBtn = document.getElementById("copyPrompt");

      function buildPrompt() {
        const background = document.getElementById("background").value;
        const style = document.getElementById("style").value;
        const sex = document.getElementById("sex").value;
        return `Generate an image with a ${sex} ${style} with a ${background} background`;
      }

      copyBtn.addEventListener("click", async () => {
        const p = buildPrompt();
        await navigator.clipboard.writeText(p);
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy Prompt"), 1200);
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.classList.add("d-none");
        img.classList.add("d-none");
        result.classList.remove("d-none");
        spinner.classList.remove("d-none");

        const prompt = buildPrompt();
        promptBox.textContent = prompt;
        promptBox.classList.remove("d-none");

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });

          if (!res.ok) {
            const t = await res.text();
            throw new Error(`API error ${res.status}: ${t}`);
          }

          const data = await res.json();
          // Supports either .url or .b64 fields from the backend
          if (data.url) {
            img.src = data.url;
          } else if (data.b64) {
            img.src = "data:image/png;base64," + data.b64;
          } else {
            throw new Error("No image returned from API");
          }
          img.alt = prompt;
          img.classList.remove("d-none");
        } catch (err) {
          errorBox.textContent = err.message || "Something went wrong generating the image.";
          errorBox.classList.remove("d-none");
        } finally {
          spinner.classList.add("d-none");
        }
      });
    </script>
  </body>
</html>
