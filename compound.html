<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compound Interest Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js" defer></script>
    <style>
      .calc-card{background:#fff;border:1px solid #dee2e6;border-radius:.5rem;padding:2rem;margin-bottom:2rem}
      .input-group-text{background:#fff;border-right:none;color:#495057}
      .input-group .form-control,.input-group .form-select{border-left:none}
      .form-label{font-weight:500;margin-bottom:.3rem}
      .field-hint{font-size:.82rem;color:#6c757d;margin-top:.25rem}
      .result-box{background:#f8f9fa;border:1px solid #dee2e6;border-radius:.375rem;padding:1rem 1.25rem;margin-bottom:1rem}
      .result-box .label{font-size:.85rem;color:#6c757d;margin-bottom:.15rem}
      .result-box .value{font-size:1.35rem;font-weight:600}
      #chartWrap{display:none;margin-top:1.5rem}
    </style>
  </head>
  <body>
    <div id="header-include"></div>
    <header class="py-5 bg-light border-bottom">
      <div class="container"><div class="row align-items-center"><div class="col-lg-8">
        <h1 class="display-6 fw-bold mb-2">Compound Interest Calculator</h1>
        <p class="lead text-secondary mb-0">See how your money grows over time with the power of compounding.</p>
      </div></div></div>
    </header>
    <main class="py-5"><div class="container">
      <div class="calc-card"><div class="row g-3">
        <div class="col-md-6"><label class="form-label">Principal Amount</label><div class="input-group"><span class="input-group-text">$</span><input type="number" id="principal" class="form-control" placeholder="e.g., 10000" min="0" /></div></div>
        <div class="col-md-6"><label class="form-label">Annual Interest Rate (%)</label><div class="input-group"><span class="input-group-text">%</span><input type="number" id="rate" class="form-control" placeholder="e.g., 7" min="0" step="0.01" /></div></div>
        <div class="col-md-6"><label class="form-label">Time Period (years)</label><input type="number" id="years" class="form-control" placeholder="e.g., 20" min="1" max="100" /></div>
        <div class="col-md-6"><label class="form-label">Compounding Frequency</label><select id="frequency" class="form-select"><option value="1">Annually</option><option value="2">Semi-Annually</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select></div>
        <div class="col-md-6"><label class="form-label">Additional Contributions</label><div class="input-group"><span class="input-group-text">$</span><input type="number" id="contribution" class="form-control" placeholder="e.g., 1200" min="0" /><select id="contribFreq" class="form-select" style="max-width:130px;border-left:1px solid #ced4da"><option value="12">per month</option><option value="1">per year</option></select></div><div class="field-hint">Optional.</div></div>
      </div><div class="mt-4 d-flex gap-2"><button class="btn btn-primary" onclick="calculate()">Calculate</button><button class="btn btn-outline-secondary" onclick="clearForm()">Clear</button></div></div>
      <div id="results" style="display:none"><div class="calc-card"><div class="row g-3">
        <div class="col-md-3 col-sm-6"><div class="result-box"><div class="label">Future Value</div><div class="value" id="resFutureValue">—</div></div></div>
        <div class="col-md-3 col-sm-6"><div class="result-box"><div class="label">Total Principal</div><div class="value" id="resPrincipal">—</div></div></div>
        <div class="col-md-3 col-sm-6"><div class="result-box"><div class="label">Total Contributions</div><div class="value" id="resContribs">—</div></div></div>
        <div class="col-md-3 col-sm-6"><div class="result-box"><div class="label">Interest Earned</div><div class="value" id="resInterest">—</div></div></div>
      </div><div id="chartWrap"><canvas id="growthChart" height="100"></canvas></div></div></div>
    </div></main>
    <div id="footer-include"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="include-loader.js"></script>
    <script>
      let chart=null;
      function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
      function calculate(){const P=parseFloat(document.getElementById('principal').value)||0,r=parseFloat(document.getElementById('rate').value)||0,yrs=parseInt(document.getElementById('years').value)||0,n=parseInt(document.getElementById('frequency').value)||12,addAmt=parseFloat(document.getElementById('contribution').value)||0,addFreq=parseInt(document.getElementById('contribFreq').value)||12;if(yrs<1){alert('Enter at least 1 year.');return;}const rpp=r/100/n,app=(addAmt*addFreq)/n;const lb=[],pd=[],cd=[],td=[];let bal=P,tc=0;for(let yr=1;yr<=yrs;yr++){for(let p=0;p<n;p++){bal=bal*(1+rpp)+app;tc+=app;}lb.push('Year '+yr);pd.push(P);cd.push(+(tc.toFixed(2)));td.push(+(bal.toFixed(2)));}document.getElementById('resFutureValue').textContent=fmt(bal);document.getElementById('resPrincipal').textContent=fmt(P);document.getElementById('resContribs').textContent=fmt(tc);document.getElementById('resInterest').textContent=fmt(bal-P-tc);document.getElementById('results').style.display='block';document.getElementById('chartWrap').style.display='block';if(chart)chart.destroy();chart=new Chart(document.getElementById('growthChart').getContext('2d'),{type:'bar',data:{labels:lb,datasets:[{label:'Principal',data:pd,backgroundColor:'#0d6efd',stack:'s'},{label:'Contributions',data:cd,backgroundColor:'#6ea8fe',stack:'s'},{label:'Interest',data:td.map((t,i)=>+(t-pd[i]-cd[i]).toFixed(2)),backgroundColor:'#cfe2ff',stack:'s'}]},options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{x:{stacked:true},y:{stacked:true}}}});document.getElementById('results').scrollIntoView({behavior:'smooth'});}
      function clearForm(){['principal','rate','years','contribution'].forEach(id=>document.getElementById(id).value='');document.getElementById('frequency').value='12';document.getElementById('contribFreq').value='12';document.getElementById('results').style.display='none';if(chart){chart.destroy();chart=null;}}
    </script>
  </body>
</html>
