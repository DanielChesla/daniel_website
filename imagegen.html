<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <!-- Header include -->
    <div id="header-include"></div>

    <main class="py-5">
      <div class="container">
        <h1 class="section-title">Image Generator</h1>
        <p class="text-secondary">Choose options and we’ll create a prompt and generate an image.</p>

        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">Background</label>
            <select id="background" class="form-select">
              <option>snow</option>
              <option>desert</option>
              <option>ocean</option>
              <option>forest</option>
              <option>field</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Character Style</label>
            <select id="style" class="form-select">
              <option>Disney style</option>
              <option>Anime style</option>
              <option>Family Guy style</option>
              <option>Simpsons style</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Character Sex</label>
            <select id="sex" class="form-select">
              <option>Male</option>
              <option>Female</option>
            </select>
          </div>
        </div>

        <button id="generate" class="btn btn-primary">Generate Image</button>
        <button id="copyPrompt" class="btn btn-outline-secondary">Copy Prompt</button>

        <div id="promptBox" class="alert alert-info mt-3 d-none"></div>
        <div id="status" class="mt-3 text-secondary"></div>
        <div id="result" class="mt-4"></div>
      </div>
    </main>

    <!-- Footer include -->
    <div id="footer-include"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="include-loader.js"></script>
    <script>
      const API_URL = "/.netlify/functions/generate-image";

      function buildPrompt() {
        const bg = document.getElementById("background").value;
        const style = document.getElementById("style").value;
        const sex = document.getElementById("sex").value;
        return `Generate an image with a ${sex} ${style} with a ${bg} background`;
      }

      document.getElementById("generate").addEventListener("click", async () => {
        const prompt = buildPrompt();
        const promptBox = document.getElementById("promptBox");
        const status = document.getElementById("status");
        const result = document.getElementById("result");

        promptBox.textContent = prompt;
        promptBox.classList.remove("d-none");

        status.textContent = "Generating...";
        result.innerHTML = "";

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });

          if (!res.ok) throw new Error("API error " + res.status);
          const data = await res.json();

          status.textContent = "Done!";
          if (data.url) {
            result.innerHTML = `<img src="${data.url}" class="img-fluid rounded shadow-sm" alt="Generated image">`;
          } else if (data.b64) {
            result.innerHTML = `<img src="data:image/png;base64,${data.b64}" class="img-fluid rounded shadow-sm" alt="Generated image">`;
          } else {
            result.textContent = "No image returned.";
          }
        } catch (err) {
          status.innerHTML = `<div class="alert alert-danger">Error: ${err.message}</div>`;
        }
      });

      document.getElementById("copyPrompt").addEventListener("click", () => {
        const prompt = buildPrompt();
        navigator.clipboard.writeText(prompt);
        alert("Prompt copied to clipboard!");
      });
    </script>
  </body>
</html>
