<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TicTacToe · Play Against a Friend</title>
    <meta name="description" content="A simple TicTacToe game built with HTML, CSS, and JavaScript. Play against a friend and track wins, losses, and ties." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css" />
    <link rel="stylesheet" href="tictactoe.css" /> <!-- optional: your custom styles -->
  </head>
  <body>
    <!-- Header injected dynamically -->
    <div id="header-include"></div>

    <!-- HERO -->
    <header class="py-5 bg-light border-bottom">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-8">
            <h1 class="display-6 fw-bold mb-2">TicTacToe</h1>
            <p class="lead text-secondary mb-0">
              Play TicTacToe in your browser! Track wins, losses, and ties while practicing logic and JavaScript.
            </p>
          </div>
        </div>
      </div>
    </header>

    <!-- GAME -->
    <main class="py-5">
      <div class="container">
        <div class="row g-4 justify-content-center">
          <div class="col-lg-6">
            <div class="card shadow-sm border-0 h-100">
              <div class="card-body text-center">
                <h2 class="h4 mb-3">Game Board</h2>
                <div id="board" class="d-grid grid-3x3 mx-auto mb-3">
                  <!-- JS will populate 9 cells here -->
                </div>
                <p class="lead fw-semibold" id="status">Player X's turn</p>
                <div class="d-flex justify-content-center gap-2 mt-3">
                  <button class="btn btn-primary" onclick="resetBoard()">Reset Game</button>
                  <button class="btn btn-outline-secondary" onclick="resetScores()">Reset Scores</button>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card shadow-sm border-0 h-100">
              <div class="card-body text-center">
                <h2 class="h4 mb-3">Scoreboard</h2>
                <ul class="list-group">
                  <li class="list-group-item d-flex justify-content-between">
                    <span>Player X Wins</span><span id="x-wins">0</span>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>Player O Wins</span><span id="o-wins">0</span>
                  </li>
                  <li class="list-group-item d-flex justify-content-between">
                    <span>Ties</span><span id="ties">0</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer injected dynamically -->
    <div id="footer-include"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Shared includes loader -->
    <script src="include-loader.js"></script>
    <!-- Your TicTacToe game logic -->
    <script src="tictactoe.js"></script>
    <script type="module" src="/analytics.js"></script>
  </body>
</html>
