<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playwright Test Runner · Daniel Chesla</title>
    <meta name="description" content="Trigger the site's Playwright smoke-test suite on GitHub Actions and watch the results live." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style1.css" />
    <style>
      .pw-test-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(128,128,128,.2); }
      .pw-test-row:last-child { border-bottom: none; }
      .pw-badge { font-size: 1.1rem; width: 1.4rem; text-align: center; flex-shrink: 0; }
      .pw-title { flex: 1; }
      .pw-ms { color: #8b949e; font-variant-numeric: tabular-nums; font-size: .85rem; }
      .pw-summary-num { font-variant-numeric: tabular-nums; font-weight: 700; }
      #results { max-width: 720px; }
    </style>
  </head>
  <body>
    <div id="header-include" data-testid="header-include-div-1"></div>

    <main class="py-5" data-testid="playwright-test-runner-click-run-to-trig-main-1">
      <div class="container" data-testid="playwright-test-runner-click-run-to-trig-div-1">
        <h1 class="mb-2" data-testid="playwright-test-runner-h1-1">Playwright Test Runner</h1>
        <p class="text-secondary" data-testid="click-run-to-trigger-the-site-s-smoke-te-p-1">
          Pick a test group (or run them all) and click run to trigger the suite on GitHub Actions against the live site.
          Results stream back here when the run finishes (about a minute).
        </p>

        <div class="d-flex align-items-center gap-3 flex-wrap mb-2" data-testid="run-tests-view-full-html-report-view-run-div-1">
          <label for="groupSelect" class="form-label mb-0" data-testid="test-group-label-1">Test group:</label>
          <select id="groupSelect" class="form-select" style="max-width:280px" data-testid="group-select-1">
            <option value="all">All tests</option>
            <option value="profile">Profile Page</option>
            <option value="contact">Contact Page</option>
            <option value="labs">Mentoring/Training Labs</option>
          </select>
          <button id="runBtn" class="btn btn-primary" data-testid="runbtn-button-1">▶ Run tests</button>
          <a id="runLink" class="btn btn-outline-secondary d-none" target="_blank" rel="noopener" data-testid="runlink-link-1">View run &amp; full report on GitHub ↗</a>
        </div>

        <div id="status" class="mt-3" data-testid="status-div-1"></div>
        <div id="results" class="mt-3" data-testid="results-div-1"></div>
      </div>
    </main>

    <div id="footer-include" data-testid="footer-include-div-1"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="include-loader.js"></script>
    <script>
      (function () {
        const runBtn = document.getElementById("runBtn");
        const groupSelect = document.getElementById("groupSelect");
        const runLink = document.getElementById("runLink");
        const statusEl = document.getElementById("status");
        const resultsEl = document.getElementById("results");

        const POLL_MS = 4000;
        const MAX_MS = 6 * 60 * 1000; // give up after 6 minutes
        let nonce = null;             // identifies THIS browser's run
        let deadline = 0;
        let errCount = 0;             // consecutive status errors

        function setStatus(message, kind, spinner) {
          const sp = spinner
            ? '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>'
            : "";
          statusEl.innerHTML = '<div class="alert alert-' + (kind || "info") + ' mb-0">' + sp + message + "</div>";
        }

        function showLink(el, href) { el.href = href; el.classList.remove("d-none"); }

        function renderResults(r) {
          const rows = r.tests
            .map(
              (t) =>
                '<div class="pw-test-row"><span class="pw-badge">' +
                (t.ok ? "✅" : "❌") +
                '</span><span class="pw-title">' +
                t.title +
                '</span><span class="pw-ms">' +
                Math.round(t.ms) +
                " ms</span></div>"
            )
            .join("");
          resultsEl.innerHTML =
            '<div class="mb-2"><span class="pw-summary-num text-success">' +
            r.passed +
            " passed</span> · <span class=\"pw-summary-num " +
            (r.failed ? "text-danger" : "text-secondary") +
            '">' +
            r.failed +
            " failed</span> · " +
            r.total +
            " total</div>" +
            rows;
        }

        async function poll() {
          if (Date.now() > deadline) {
            setStatus("Timed out waiting for results. Check the run on GitHub.", "warning");
            runBtn.disabled = false;
            return;
          }
          try {
            const res = await fetch("/api/test-status?nonce=" + encodeURIComponent(nonce), { cache: "no-store" });
            const d = await res.json();
            if (!res.ok) throw new Error(d.error || "status error");
            errCount = 0; // got a good response

            if (d.runUrl) showLink(runLink, d.runUrl);

            if (d.state === "pending") {
              setStatus("Queued — waiting for the run to start…", "primary", true);
            } else if (d.state !== "completed") {
              setStatus("Running tests on GitHub Actions…", "primary", true);
            } else if (d.conclusion === "success" && !d.resultsReady) {
              // Run finished but the report for THIS run hasn't synced yet — keep waiting.
              setStatus("Run finished — syncing this run's results…", "primary", true);
            } else {
              const ok = d.conclusion === "success";
              setStatus(
                (ok ? "✅ All tests passed" : "❌ Run " + d.conclusion) + " — see the run on GitHub for the full report",
                ok ? "success" : "danger"
              );
              if (d.resultsReady && d.results) renderResults(d.results);
              else resultsEl.innerHTML = '<div class="text-secondary small">Results unavailable — open the run on GitHub for the full report.</div>';
              runBtn.disabled = false;
              return;
            }
          } catch (e) {
            // Tolerate a few transient hiccups, then surface the error instead
            // of spinning forever (e.g. a stale tab from before a deploy).
            if (++errCount >= 3) {
              setStatus("Couldn't get the test status. Please refresh the page (Ctrl/Cmd+Shift+R) and try again.", "danger");
              runBtn.disabled = false;
              return;
            }
          }
          setTimeout(poll, POLL_MS);
        }

        runBtn.addEventListener("click", async () => {
          runBtn.disabled = true;
          runLink.classList.add("d-none");
          resultsEl.innerHTML = "";
          errCount = 0;
          const group = groupSelect.value;
          const groupLabel = groupSelect.options[groupSelect.selectedIndex].text;
          setStatus("Dispatching the workflow — " + groupLabel + "…", "primary", true);
          try {
            const res = await fetch("/api/run-tests?group=" + encodeURIComponent(group), { method: "POST" });
            const d = await res.json();
            if (!res.ok || !d.ok) throw new Error(d.error || "dispatch failed");
            nonce = d.nonce;
            deadline = Date.now() + MAX_MS;
            setStatus("Queued — waiting for the run to start (" + groupLabel + ")…", "primary", true);
            setTimeout(poll, POLL_MS);
          } catch (e) {
            setStatus("Error: " + (e.message || e), "danger");
            runBtn.disabled = false;
          }
        });
      })();
    </script>
    <script type="module" src="/analytics.js"></script>
  </body>
</html>
