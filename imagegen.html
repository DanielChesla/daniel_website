<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Generator</title>
    <meta name="description" content="Generate AI images based on character style, sex, and background." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <div id="header-include"></div>

    <main class="py-5">
      <div class="container">
        <h1 class="mb-4">Image Generator</h1>
        <p class="text-secondary">Choose options and we’ll create a prompt and generate an image — free, no sign-up, powered by <a href="https://pollinations.ai" target="_blank" rel="noopener" data-testid="pollinations-ai-link-1">Pollinations.ai</a>.</p>

        <form id="imageForm" class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">Background</label>
            <select id="background" class="form-select" data-testid="background-select-1">
              <option>City New York</option>
              <option>City London</option>
              <option>City Tokyo</option>
              <option>Medieval Village</option>
              <option>Snowy Mountain</option>
              <option>Desert</option>
              <option>Beach</option>
              <option>Forest</option>
              <option>Field</option>
              <option>Underwater</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Character Style</label>
            <select id="style" class="form-select" data-testid="style-select-1">
              <option>Disney style</option>
              <option>Anime style</option>
              <option>Family Guy style</option>
              <option>Simpsons style</option>
              <option>Looney Tunes style</option>
              <option>Peanuts style</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Character Mix</label>
            <select id="mix" class="form-select" data-testid="mix-select-1">
              <option>Male and Female group of friends</option>
              <option>Male group of friends</option>
              <option>Female group of friends</option>
              <option>Small Family</option>
              <option>Large Family</option>
              <option>Family with Pets</option>
              <option>Solo Female</option>
              <option>Solo Male</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Realism Level</label>
            <select id="realism" class="form-select" data-testid="realism-select-1">
              <option>Most Realistic: “photo-realistic, highly detailed, natural lighting, true-to-life colors”</option>
              <option>Semi-Realistic: “realistic with slight stylization, softer edges, mild artistic feel”</option>
              <option>Balanced / Stylized: “blend of realism and cartoon, simplified details, moderate stylization”</option>
              <option>Cartoonish: “cartoon style, bold outlines, exaggerated features, flat colors”</option>
              <option>Most Cartoonish: “highly stylized cartoon, simplified shapes, strong outlines, vibrant exaggerated colors”</option>
            </select>
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary" id="generateBtn" data-testid="generatebtn-button-1">Generate Image</button>
            <button type="button" id="copyPrompt" class="btn btn-outline-secondary" data-testid="copyprompt-button-1">Copy Prompt</button>
          </div>
        </form>

        <div id="promptBox" class="alert alert-info d-none"></div>
        <div id="statusBox" class="mt-3"></div>
        <div id="resultBox" class="mt-4 text-center"></div>
      </div>
    </main>

    <div id="footer-include"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="include-loader.js"></script>

    <script>
  (function () {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else { init(); }

    function init() {
      // Free, keyless image generation via Pollinations.ai — no API key, no proxy.
      const POLLINATIONS_BASE = "https://image.pollinations.ai/prompt/";

      const formEl      = document.getElementById("imageForm");
      const promptBox   = document.getElementById("promptBox");
      const statusBox   = document.getElementById("statusBox");
      const resultBox   = document.getElementById("resultBox");
      const copyBtn     = document.getElementById("copyPrompt");
      const generateBtn = document.getElementById("generateBtn");

      function showStatus(message, kind = "info", withSpinner = false) {
        const spinner = withSpinner
          ? '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>'
          : "";
        statusBox.innerHTML = '<div class="alert alert-' + kind + ' mb-0">' + spinner + message + '</div>';
      }
      function clearStatus() { statusBox.innerHTML = ""; }

      function buildPrompt() {
        const background = document.getElementById("background").value;
        const style      = document.getElementById("style").value;
        const mix        = document.getElementById("mix").value;
        const realismSel = document.getElementById("realism").value;
        const realism    = (realismSel.split(":")[0] || realismSel).trim();
        return `Generate a family friendly ${realism} image with a ${mix} ${style} character with a ${background} background. Avoid gore, nudity, unsafe content.`;
      }

      formEl.addEventListener("submit", (e) => {
        e.preventDefault();
        resultBox.innerHTML = "";
        generateBtn.disabled = true;

        const prompt = buildPrompt();
        promptBox.textContent = prompt;
        promptBox.classList.remove("d-none");
        showStatus("Generating image… (this can take 10–20 seconds)", "primary", true);

        // Build the Pollinations URL. A random seed makes each run unique.
        const seed = Math.floor(Math.random() * 1e9);
        const params = new URLSearchParams({
          width: "768", height: "768", model: "flux", nologo: "true", seed: String(seed)
        });
        const url = POLLINATIONS_BASE + encodeURIComponent(prompt) + "?" + params.toString();

        // Loading the <img> triggers generation; onload fires when it's ready.
        const img = new Image();
        img.className = "img-fluid rounded shadow";
        img.alt = "Generated image";
        img.onload = () => {
          resultBox.innerHTML = "";
          resultBox.appendChild(img);
          const link = document.createElement("div");
          link.className = "mt-2";
          link.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener" class="small">Open full size ↗</a>';
          resultBox.appendChild(link);
          clearStatus();
          generateBtn.disabled = false;
        };
        img.onerror = () => {
          showStatus("Error: image generation failed. Please try again in a moment.", "danger");
          generateBtn.disabled = false;
        };
        img.src = url;
      });

      copyBtn?.addEventListener("click", () => {
        if (!promptBox.textContent) return;
        navigator.clipboard.writeText(promptBox.textContent).then(() => {
          const original = copyBtn.textContent;
          copyBtn.textContent = "Copied!";
          setTimeout(() => (copyBtn.textContent = original), 1500);
        });
      });
    }
  })();
</script>
  <script type="module" src="/analytics.js"></script>
  </body>
</html>
