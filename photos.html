    <main data-testid="photos-a-responsive-gallery-with-a-simpl-main-1">
      <header class="py-5 bg-light border-bottom" data-testid="photos-a-responsive-gallery-with-a-simpl-header-1">
        <div class="container" data-testid="photos-a-responsive-gallery-with-a-simpl-div-1">
          <h1 class="display-6 fw-bold mb-1" data-testid="photos-h1-1">Photos</h1>
          <p class="text-secondary mb-0" data-testid="a-responsive-gallery-with-a-simple-light-p-1">A responsive gallery with a simple lightbox.</p>
        </div>
      </header>

      <section class="py-5" id="photos" data-testid="photos-section-1">
        <div class="container" data-testid="photos-div-1">
          <div class="row g-3" data-testid="photos-div-2">
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="bird.jpg" alt="Bird" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="bird-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-4"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="flower.jpg" alt="Hibiscus" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="hibiscus-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-5"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="lizard.jpg" alt="Lizard" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="lizard-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-6"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="suzuki.jpg" alt="Suzuki Samurai" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="suzuki-samurai-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-7"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="frog.jpg" alt="Frog" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="frog-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-8"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="ocean.jpg" alt="Ocean sunrise" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="ocean-sunrise-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-9"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="banana.jpg" alt="Banana" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="banana-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-10"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="pineapple.jpg" alt="Pineapple" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="pineapple-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-11"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="squirrel.jpg" alt="Squirrel" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="squirrel-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-12"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="cat.jpg" alt="Cat" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="cat-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-13"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="cactus.jpg" alt="Cactus" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="cactus-img-1" /></div>
            <div class="col-6 col-md-4 col-lg-3" data-testid="photos-div-14"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="fish.jpg" alt="Fish" data-bs-toggle="modal" data-bs-target="#lightbox" data-testid="fish-img-1" /></div>
          </div>
        </div>

        <div class="modal fade" id="lightbox" tabindex="-1" aria-hidden="true" data-testid="lightbox-div-1">
          <div class="modal-dialog modal-dialog-centered modal-lg" data-testid="photos-div-15">
            <div class="modal-content border-0" data-testid="photos-div-16">
              <div class="modal-body p-0" data-testid="photos-div-17">
                <img id="lightbox-img" class="img-fluid w-100 rounded" alt="Preview" data-testid="lightbox-img-img-1" />
              </div>
              <div class="modal-footer border-0" data-testid="close-div-1">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-testid="close-button-1">Close</button>
              </div>
            </div>
          </div>
        </div>
      </section>

        <span data-testid="photos-span-1">© <span id="year" data-testid="year-span-1"></span> Daniel Chesla</span>
        <div class="d-flex gap-2" data-testid="home-github-div-1">
          <a href="https://danielchesla.com" class="link-body-emphasis" data-testid="home-link-2">Home</a>
          <a href="https://github.com/danielchesla" class="link-body-emphasis" data-testid="github-link-1">GitHub</a>
        </div>
      </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
      const imgs = document.querySelectorAll('.gallery-img');
      const lightboxImg = document.getElementById('lightbox-img');
      imgs.forEach(img => img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
      }));
    </script>
    <script type="module" src="/analytics.js"></script>
