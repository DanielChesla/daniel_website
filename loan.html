<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loan Amortization Calculator</title>
    <meta name="description" content="Borrowed amount auto-calculated from sale price and down payment. Includes property tax and homeowners insurance for monthly totals." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css" />
    <style>
      .money { font-variant-numeric: tabular-nums; }
      .muted { color: #667085; }
      .calc-card { max-width: 980px; margin:auto; }
      .table thead th { white-space: nowrap; }
      .input-group-text { min-width: 2.5rem; justify-content:center; }
    </style>
  </head>
  <body>
    <!-- Header injected from /includes/header.html -->
    <div id="header-include"></div>

    <!-- HERO -->
    <header class="py-5 bg-light border-bottom">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-8">
            <h1 class="display-6 fw-bold mb-2">Loan Amortization Calculator</h1>
            <p class="lead text-secondary mb-0">
              <strong>Borrowed Amount</strong> is computed as <strong>Sale Price − Down Payment</strong>. Add taxes & insurance for your full monthly picture.
            </p>
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="py-5">
      <div class="container">
        <div class="row g-4">
          <div class="col-12">
            <div class="card shadow-sm border-0 calc-card">
              <div class="card-body">
                <form id="loan-form" onsubmit="event.preventDefault(); calculateAmortization();">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label for="salePrice" class="form-label">Sale Price</label>
                      <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="salePrice" placeholder="e.g., 350000" min="0" step="0.01" required>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <label for="downPayment" class="form-label">Down Payment</label>
                      <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="downPayment" placeholder="e.g., 70000" min="0" step="0.01" required>
                      </div>
                    </div>

                    <!-- Borrowed amount (readonly) -->
                    <div class="col-md-6">
                      <label for="principal" class="form-label">Borrowed Amount</label>
                      <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="principal" value="0" readonly>
                      </div>
                      <div id="principalWarn" class="form-text text-warning d-none">Down payment exceeds sale price. Borrowed amount set to $0.00.</div>
                    </div>

                    <div class="col-md-3">
                      <label for="interest" class="form-label">Annual Interest Rate (%)</label>
                      <input type="number" class="form-control" step="0.01" id="interest" placeholder="e.g., 6.75" required>
                    </div>
                    <div class="col-md-3">
                      <label for="term" class="form-label">Loan Term (years)</label>
                      <input type="number" class="form-control" step="1" id="term" placeholder="e.g., 30" required>
                    </div>

                    <!-- Property tax -->
                    <div class="col-md-6">
                      <label for="propertyTax" class="form-label">Property Tax</label>
                      <div class="input-group">

                        <input type="number" class="form-control" id="propertyTax" place
