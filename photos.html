    <main>
      <header class="py-5 bg-light border-bottom">
        <div class="container">
          <h1 class="display-6 fw-bold mb-1">Photos</h1>
          <p class="text-secondary mb-0">A responsive gallery with a simple lightbox.</p>
        </div>
      </header>

      <section class="py-5" id="photos">
        <div class="container">
          <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="bird.jpg" alt="Bird" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="flower.jpg" alt="Hibiscus" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="lizard.jpg" alt="Lizard" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="suzuki.jpg" alt="Suzuki Samurai" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="frog.jpg" alt="Frog" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="ocean.jpg" alt="Ocean sunrise" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="banana.jpg" alt="Banana" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="pineapple.jpg" alt="Pineapple" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="squirrel.jpg" alt="Squirrel" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="cat.jpg" alt="Cat" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="cactus.jpg" alt="Cactus" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
            <div class="col-6 col-md-4 col-lg-3"><img loading="lazy" class="img-fluid rounded-3 shadow-sm gallery-img" src="fish.jpg" alt="Fish" data-bs-toggle="modal" data-bs-target="#lightbox" /></div>
          </div>
        </div>

        <div class="modal fade" id="lightbox" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0">
              <div class="modal-body p-0">
                <img id="lightbox-img" class="img-fluid w-100 rounded" alt="Preview" />
              </div>
              <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="py-4 border-top small">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <span>© <span id="year"></span> Daniel Chesla</span>
        <div class="d-flex gap-2">
          <a href="https://danielchesla.com" class="link-body-emphasis">Home</a>
          <a href="https://github.com/danielchesla" class="link-body-emphasis">GitHub</a>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
      const imgs = document.querySelectorAll('.gallery-img');
      const lightboxImg = document.getElementById('lightbox-img');
      imgs.forEach(img => img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
      }));
    </script>
    <script type="module" src="/analytics.js"></script>
