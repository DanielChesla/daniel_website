<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather · Current Conditions</title>
    <meta name="description" content="Enter a US ZIP code to see current weather conditions." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <!-- Header injected dynamically -->
    <div id="header-include"></div>

    <header class="py-5 bg-light border-bottom">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-8">
            <h1 class="display-6 fw-bold mb-2">Weather</h1>
            <p class="lead text-secondary mb-0">Enter a US ZIP code to fetch current conditions.</p>
          </div>
        </div>
      </div>
    </header>

    <main class="py-5">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-5">
            <div class="card shadow-sm border-0 h-100">
              <div class="card-body">
                <h2 class="h4 mb-3">Search</h2>
                <form class="row g-3" onsubmit="event.preventDefault(); const z=document.getElementById('zip').value.trim(); if(z) getWeather(z);">
                  <div class="col-12">
                    <label for="zip" class="form-label">ZIP code</label>
                    <input type="text" class="form-control" id="zip" placeholder="e.g., 33431" required />
                    <div class="form-text">Your current weather.js expects a ZIP.</div>
                  </div>
                  <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">Get Weather</button>
                    <button type="reset" class="btn btn-outline-secondary" onclick="document.getElementById('weather').innerHTML='';">Clear</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-7">
            <div class="card shadow-sm border-0 h-100">
              <div class="card-body">
                <h2 class="h4 mb-3">Current Conditions</h2>
                <!-- weather.js writes here -->
                <div id="weather" class="p-3 border rounded-3 bg-white">Enter a ZIP and click Get Weather.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer injected dynamically -->
    <div id="footer-include"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Shared includes loader (relative path for GitHub Pages) -->
    <script src="include-loader.js"></script>
    <!-- Your existing script (unchanged) -->
    <script src="weather.js"></script>
    <script type="module" src="/analytics.js"></script>
  </body>
</html>
