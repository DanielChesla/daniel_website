<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Generator</title>
    <meta name="description" content="Generate AI images based on character style, mix, realism level, and background." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <!-- Header (loaded by include-loader.js) -->
    <div id="header-include"></div>

    <main class="py-5">
      <div class="container">
        <h1 class="mb-2">Image Generator</h1>
        <p class="text-secondary mb-4">Choose options and we’ll create a clean prompt and call your image API.</p>

        <form id="imageForm" class="row g-3 mb-4">
          <!-- Background -->
          <div class="col-md-4">
            <label class="form-label" for="background">Background</label>
            <select id="background" class="form-select">
              <option>City New York</option>
              <option>City London</option>
              <option>City Tokyo</option>
              <option>Medieval Village</option>
              <option>Snowy Mountain</option>
              <option>Desert</option>
              <option>Beach</option>
              <option>Forest</option>
              <option>Field</option>
              <option>Underwater</option>
            </select>
          </div>

          <!-- Character Style -->
          <div class="col-md-4">
            <label class="form-label" for="style">Character Style</label>
            <select id="style" class="form-select">
              <option>Disney style</option>
              <option>Anime style</option>
              <option>Family Guy style</option>
              <option>Simpsons style</option>
              <option>Looney Tunes style</option>
              <option>Peanuts style</option>
            </select>
          </div>

          <!-- Character Mix -->
          <div class="col-md-4">
            <label class="form-label" for="mix">Character Mix</label>
            <select id="mix" class="form-select">
              <option>Male and Female group of friends</option>
              <option>Male group of friends</option>
              <option>Female group of friends</option>
              <option>Small Family</option>
              <option>Large Family</option>
              <option>Family with Pets</option>
              <option>Solo Female</option>
              <option>Solo Male</option>
            </select>
          </div>

          <!-- Realism Level -->
          <div class="col-md-6">
            <label class="form-label" for="realism">Realism Level</label>
            <select id="realism" class="form-select">
              <option value="Most Realistic">Most Realistic — photo-realistic, highly detailed, natural lighting, true-to-life colors</option>
              <option value="Semi-Realistic">Semi-Realistic — realistic with slight stylization, softer edges, mild artistic feel</option>
              <option value="Balanced / Stylized">Balanced / Stylized — blend of realism and cartoon, simplified details, moderate stylization</option>
              <option value="Cartoonish
