<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather · Current Conditions</title>
    <meta name="description" content="Enter a US ZIP code to see current weather conditions." />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <!-- Header injected dynamically -->
    <div id="header-include" data-testid="header-include-div-1"></div>

    <header class="py-5 bg-light border-bottom" data-testid="weather-enter-a-us-zip-code-to-fetch-cur-header-1">
      <div class="container" data-testid="weather-enter-a-us-zip-code-to-fetch-cur-div-1">
        <div class="row align-items-center" data-testid="weather-enter-a-us-zip-code-to-fetch-cur-div-2">
          <div class="col-lg-8" data-testid="weather-enter-a-us-zip-code-to-fetch-cur-div-3">
            <h1 class="display-6 fw-bold mb-2" data-testid="weather-h1-1">Weather</h1>
            <p class="lead text-secondary mb-0" data-testid="enter-a-us-zip-code-to-fetch-current-con-p-1">Enter a US ZIP code to fetch current conditions.</p>
          </div>
        </div>
      </div>
    </header>

    <main class="py-5" data-testid="search-zip-code-your-current-weather-js-main-1">
      <div class="container" data-testid="search-zip-code-your-current-weather-js-div-1">
        <div class="row g-4" data-testid="search-zip-code-your-current-weather-js-div-2">
          <div class="col-lg-5" data-testid="search-zip-code-your-current-weather-js-div-3">
            <div class="card shadow-sm border-0 h-100" data-testid="search-zip-code-your-current-weather-js-div-4">
              <div class="card-body" data-testid="search-zip-code-your-current-weather-js-div-5">
                <h2 class="h4 mb-3" data-testid="search-h2-1">Search</h2>
                <form class="row g-3" onsubmit="event.preventDefault(); const z=document.getElementById('zip').value.trim(); if(z) getWeather(z);" data-testid="zip-code-your-current-weather-js-expects-form-1">
                  <div class="col-12" data-testid="zip-code-your-current-weather-js-expects-div-1">
                    <label for="zip" class="form-label" data-testid="zip-code-label-1">ZIP code</label>
                    <input type="text" class="form-control" id="zip" placeholder="e.g., 33431" required data-testid="zip-code-text-1" />
                    <div class="form-text" data-testid="your-current-weather-js-expects-a-zip-div-1">Your current weather.js expects a ZIP.</div>
                  </div>
                  <div class="col-12 d-flex gap-2" data-testid="get-weather-clear-div-1">
                    <button type="submit" class="btn btn-primary btn-lg" data-testid="get-weather-button-1">Get Weather</button>
                    <button type="reset" class="btn btn-outline-secondary" onclick="document.getElementById('weather').innerHTML='';" data-testid="clear-button-1">Clear</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-7" data-testid="current-conditions-enter-a-zip-and-click-div-1">
            <div class="card shadow-sm border-0 h-100" data-testid="current-conditions-enter-a-zip-and-click-div-2">
              <div class="card-body" data-testid="current-conditions-enter-a-zip-and-click-div-3">
                <h2 class="h4 mb-3" data-testid="current-conditions-h2-1">Current Conditions</h2>
                <!-- weather.js writes here -->
                <div id="weather" class="p-3 border rounded-3 bg-white" data-testid="weather-div-1">Enter a ZIP and click Get Weather.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer injected dynamically -->
    <div id="footer-include" data-testid="footer-include-div-1"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Shared includes loader (relative path for GitHub Pages) -->
    <script src="include-loader.js"></script>
    <!-- Your existing script (unchanged) -->
    <script src="weather.js"></script>
    <script type="module" src="/analytics.js"></script>
  </body>
</html>
